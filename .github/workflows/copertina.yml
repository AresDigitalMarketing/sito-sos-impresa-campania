# Operazione una tantum: ricava la copertina del Pizzino Trentennale dal vecchio sito.
name: Copertina Pizzino
on:
  push:
    branches: [main]
    paths: [".github/workflows/copertina.yml"]
permissions:
  contents: write
jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -q poppler-utils
          mkdir -p src/uploads/pubblicazioni
          B=https://www.sosimpresacampania.it/wp-content/uploads
          curl -fsSL -A "Mozilla/5.0" -o /tmp/p.pdf $B/2025/10/SosImpresa_Pizzino_Trentennale.pdf
          pdfinfo /tmp/p.pdf | grep -E "Pages|Page size"
          pdftoppm -jpeg -r 130 -f 1 -l 2 /tmp/p.pdf src/uploads/pubblicazioni/tmp-pizzino
          curl -fsSL -A "Mozilla/5.0" -o src/uploads/pubblicazioni/tmp-grande.jpg $B/2025/12/SosImpresa_Pizzino_Trentennale_pages-to-jpg-0002.jpg || true
          ls -la src/uploads/pubblicazioni
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/uploads/pubblicazioni
          git commit -m "Copertina del Pizzino dal PDF originale" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01FP3VfcYL9npNUDL6fgdwQF"
          git push
