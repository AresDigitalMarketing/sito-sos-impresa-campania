# Operazione una tantum: copia nell'archivio tre foto del Premio dal vecchio sito.
name: Foto del Premio
on:
  push:
    branches: [main]
    paths: [".github/workflows/foto-premio.yml"]
permissions:
  contents: write
jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p src/uploads/premio
          B=https://www.sosimpresacampania.it/wp-content/uploads
          curl -fsSL -A "Mozilla/5.0" -o src/uploads/premio/originale-2019.jpg $B/2025/09/premiocavaliere.jpg
          curl -fsSL -A "Mozilla/5.0" -o src/uploads/premio/originale-2020.jpg $B/2020/07/2020.jpeg
          curl -fsSL -A "Mozilla/5.0" -o src/uploads/premio/originale-2021.jpg $B/2021/07/PREMIO-MICHELE-CAVALIERE-2021.jpeg
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/uploads/premio
          git commit -m "Copiate le foto originali del Premio dal vecchio sito" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01FP3VfcYL9npNUDL6fgdwQF"
          git push
