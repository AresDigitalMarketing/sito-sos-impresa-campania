# Operazione una tantum: crea il PDF dei comunicati che hanno solo l'immagine.
name: PDF dei comunicati
on:
  push:
    branches: [main]
    paths: [".github/workflows/pdf-comunicati.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  converti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install img2pdf
      - name: Converte le immagini in PDF
        shell: python
        run: |
          import pathlib, re, urllib.request, img2pdf
          base = "https://www.sosimpresacampania.it"
          a4 = (img2pdf.mm_to_pt(210), img2pdf.mm_to_pt(297))
          uscita = pathlib.Path("src/uploads/comunicati")
          uscita.mkdir(parents=True, exist_ok=True)
          fatti = 0
          for md in sorted(pathlib.Path("src/comunicati").glob("*.md")):
              testo = md.read_text(encoding="utf-8")
              file_ = re.search(r"^file: (.+)$", testo, re.M).group(1).strip()
              if file_.lower().endswith(".pdf"):
                  continue
              immagine = re.search(r"^image: (.+)$", testo, re.M).group(1).strip()
              req = urllib.request.Request(base + immagine, headers={"User-Agent": "Mozilla/5.0"})
              dati = urllib.request.urlopen(req, timeout=120).read()
              if len(dati) < 10000:
                  raise SystemExit(f"Immagine sospetta: {immagine}")
              pdf = uscita / f"{md.stem}.pdf"
              pdf.write_bytes(img2pdf.convert(dati, layout_fun=img2pdf.get_layout_fun(a4)))
              nuovo = f"/uploads/comunicati/{pdf.name}"
              md.write_text(testo.replace(f"file: {file_}", f"file: {nuovo}", 1), encoding="utf-8")
              print(md.stem, len(dati), "->", pdf.stat().st_size)
              fatti += 1
          print("Convertiti:", fatti)
      - name: Salva i PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/comunicati src/uploads/comunicati
          git diff --cached --quiet && exit 0
          git commit -m "Creati i PDF dei comunicati disponibili solo come immagine" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01FP3VfcYL9npNUDL6fgdwQF"
          git push
