# Operazione una tantum: verifica DNS e posta dopo il passaggio a Cloudflare.
name: Verifica dominio
on:
  push:
    branches: [main]
    paths: [".github/workflows/verifica.yml"]
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for t in NS MX TXT; do echo "== $t"; dig +short sosimpresacampania.it $t @1.1.1.1; done
          for h in mx mail smtp imap pop3 pec webmail www; do echo "== $h"; dig +short $h.sosimpresacampania.it @1.1.1.1 | head -3; done
          echo "== smtp porta 25 su mx"; timeout 10 bash -c 'exec 3<>/dev/tcp/mx.sosimpresacampania.it/25; head -1 <&3' || echo ko
          echo "== imap 993"; timeout 10 bash -c 'echo | openssl s_client -connect imap.sosimpresacampania.it:993 -servername imap.sosimpresacampania.it 2>/dev/null | head -3' || echo ko
          curl -sI http://sosimpresacampania.it/chi-siamo/ | head -3
          curl -sI https://sosimpresacampania.it/ | grep -i -E "^HTTP|^location"
          curl -sI https://www.sosimpresacampania.it/ | head -1
